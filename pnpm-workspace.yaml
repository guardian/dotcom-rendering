packages:
  - 'dotcom-rendering'
  - 'ab-testing'
  - 'ab-testing/*'
allowBuilds:
  '@swc/core': true
  esbuild: true
  nice-napi: true
  protobufjs: false # Its postinstall only prints a version-scheme warning, it builds nothing
  unrs-resolver: false # This postinstall is just a workaround for an npm issue so we don't need it https://github.com/unrs/unrs-resolver/pull/66
blockExoticSubdeps: true
catalog:
  '@aws-sdk/client-s3': 3.995.0
  '@aws-sdk/client-ssm': 3.995.0
  '@guardian/cdk': 64.7.0
  '@guardian/eslint-config': 16.0.0
  '@guardian/tsconfig': 1.0.1
  '@rollup/plugin-commonjs': 29.0.3
  '@rollup/plugin-json': 6.1.0
  '@rollup/plugin-node-resolve': 16.0.3
  '@types/aws-lambda': 8.10.158
  '@types/node': 24.12.4
  aws-cdk: 2.1141.0
  aws-cdk-lib: 2.269.0
  constructs: 10.8.1
  esbuild: 0.28.1
  eslint: 9.39.5
  rollup: 4.59.0
  rollup-plugin-esbuild: 6.2.1
  tslib: 2.6.2
  type-fest: 5.9.0
  typescript: 6.0.3
  valibot: 1.4.2
minimumReleaseAge: 2880 # 2 day minimum package version age
minimumReleaseAgeExclude:
  - '@guardian/*'
overrides:
  # Ensure @guardian/eslint-config resolves to the same typescript-eslint
  # packages we use directly, otherwise eslint fails to load with a
  # "Cannot redefine plugin" error caused by duplicate plugin instances.
  typescript-eslint: 8.70.0
  '@typescript-eslint/eslint-plugin': 8.70.0
  '@typescript-eslint/parser': 8.70.0
  '@typescript-eslint/utils': 8.70.0
