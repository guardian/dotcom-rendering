on:
  workflow_call:

jobs:
  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node environment
        uses: ./.github/actions/setup-node-env

      - name: Run Jest
        run: CI=true IMAGE_DIGEST=sha256:12345 pnpm test
        working-directory: dotcom-rendering
