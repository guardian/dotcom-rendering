name: ⏰ Scheduled daily jobs
on:
  schedule:
    # Every work day of the week at 08:08
    - cron: '8 8 * * MON-FRI'

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env

      - name: Thrasher tracker
        run: pnpm --filter scripts thrasher-tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: iFrame titles tracker
        run: pnpm --filter scripts iframe-titles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPI_KEY: ${{ secrets.CAPI_KEY }}
