on:
  workflow_call:
    secrets:
      GU_ARTIFACTS_ROLE_ARN:
        required: true
    inputs:
      production-image-digest:
        description: 'Digest of DCR image in AWS ECR'
        required: true
        type: string

jobs:
  playwright:
    # We currently only publish an ARM64 Docker image, we have to match to run it
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write # Required to exchange for AWS credentials using OIDC
    strategy:
      fail-fast: false
      matrix:
        # keep aligned with the number of shards used by `playwright test`
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node environment
        uses: ./.github/actions/setup-node-env

      # TODO abstract this into a reusable GitHub Action e.g. https://github.com/guardian/actions-publish-image
      - name: AWS ECR configure credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.GU_ARTIFACTS_ROLE_ARN }}
          aws-region: eu-west-1
          mask-aws-account-id: 'true'

      # TODO abstract this into a reusable GitHub Action e.g. https://github.com/guardian/actions-publish-image
      - name: AWS ECR login
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          mask-password: 'true'

      # Clear AWS credentials (stored in environment variables) to avoid leaking them to any subsequent steps
      # See https://github.com/aws-actions/configure-aws-credentials/issues/1308
      # TODO abstract this into a reusable GitHub Action e.g. https://github.com/guardian/actions-publish-image
      - name: AWS ECR clear credentials
        if: always()
        shell: bash
        run: |
          echo "AWS_ACCESS_KEY_ID=''" >>"$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=''" >>"$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=''" >>"$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=''" >>"$GITHUB_ENV"
          echo "AWS_REGION=''" >>"$GITHUB_ENV"

      # TODO abstract this into a reusable GitHub Action e.g. https://github.com/guardian/actions-publish-image
      - name: AWS ECR pull image
        id: ecr-pull
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/guardian/dotcom-rendering@${{ inputs.production-image-digest }}"
          docker pull $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      # `GU_STAGE=CI` defaults DCR to reference JS assets from the local server, rather than the CDN.
      - name: Start DCR in a container
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          docker run -d \
            -p 9000:9000 \
            -e "GU_APP=article-rendering" \
            -e "GU_STACK=frontend" \
            -e "GU_STAGE=CI" \
            -e "DISABLE_LOGGING_AND_METRICS=true" \
            $IMAGE

      - name: Turn off mandb updates
        run: |
          sudo mv /usr/bin/mandb /usr/bin/mandb-OFF
          sudo cp -p /bin/true /usr/bin/mandb

      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps chromium
        working-directory: ./dotcom-rendering

      - name: Run Playwright
        run: pnpm playwright test --shard=${{ matrix.group }}/8
        working-directory: ./dotcom-rendering
        env:
          NODE_ENV: production

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.group }}
          path: ./dotcom-rendering/playwright-report
          retention-days: 5
