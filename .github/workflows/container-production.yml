name: Production container
on:
  workflow_call:
    secrets:
      GU_ARTIFACTS_ROLE_ARN:
        required: true
    outputs:
      imageDigest:
        description: 'The digest of the generated container image'
        value: ${{ jobs.build-production-image.outputs.imageDigest }}
jobs:
  build-production-image:
    # ECS tasks run on ARM, so we use the arm runner to natively build the containaer image (rather than rely on emulation)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write # Required to exchange for AWS credentials using OIDC
      pull-requests: write # Required by guardian/actions-publish-image to comment on PRs
    outputs:
      imageDigest: ${{ steps.publish-image.outputs.imageDigest }}
    steps:
      - uses: actions/checkout@v7
      - name: Add commit hash for PRout
        working-directory: dotcom-rendering
        run: echo 'export const GIT_COMMIT_HASH = "${{ github.sha }}";' > src/server/prout.ts
      - name: Build image
        run: docker buildx build --platform linux/arm64 -f Production.dockerfile -t ${{ github.repository }}:latest .
      - name: Publish Image
        uses: guardian/actions-publish-image/push@multi-action
        id: publish-image
        with:
          roleArn: ${{ secrets.GU_ARTIFACTS_ROLE_ARN }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          appName: dotcom-rendering
