name: DCR typescript 🕵‍♀
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    paths-ignore:
      - 'dotcom-rendering/docs/**'

jobs:
  typescript:
    name: Typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node environment
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Check typescript
        run: pnpm tsc
        working-directory: dotcom-rendering
