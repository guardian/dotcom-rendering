name: 🧪 AB testing

permissions:
  contents: read

on:
  merge_group:
    types: [checks_requested]
  push:

jobs:
  pre-check:
    name: Can we skip AB testing CI?
    runs-on: ubuntu-latest
    outputs:
      should-run-ci: ${{ steps.should-run.outputs.should-run-ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: relevant-files-changed
        with:
          filters: |
            relevant:
              - 'ab-testing/**'
              - '.github/workflows/ab-testing-ci.yml'
              - 'pnpm-workspace.yaml'

      - name: Should Run
        id: should-run
        run: >-
          echo "should-run-ci=${{ github.event_name == 'merge_group' || (github.ref != 'refs/heads/main' && steps.relevant-files-changed.outputs.relevant == 'true') }}" >> "$GITHUB_OUTPUT"

  ab-testing-checks:
    runs-on: ubuntu-latest
    name: AB testing checks
    needs: [pre-check]
    if: ${{ needs.pre-check.outputs.should-run-ci == 'true' }}
    defaults:
      run:
        working-directory: ab-testing
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node environment
        uses: ./.github/actions/setup-node-env

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

  config-ci:
    runs-on: ubuntu-latest
    name: Config CI
    needs: [pre-check, ab-testing-checks]
    if: ${{ needs.pre-check.outputs.should-run-ci == 'true' }}
    defaults:
      run:
        working-directory: ab-testing/config
    env:
      FASTLY_AB_TESTING_CONFIG: ${{ secrets.FASTLY_PROD_AB_TESTING_CONFIG }}
      FASTLY_API_TOKEN: ${{ secrets.FASTLY_PROD_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node environment
        uses: ./.github/actions/setup-node-env

      - name: Validate
        run: pnpm validate

      - name: Build
        run: pnpm build

      - uses: actions/upload-artifact@v7
        with:
          name: ab-testing-build
          path: ab-testing/config/dist

  ui-ci:
    name: UI CI
    runs-on: ubuntu-latest
    needs: [pre-check, ab-testing-checks]
    if: ${{ needs.pre-check.outputs.should-run-ci == 'true' }}
    defaults:
      run:
        working-directory: ab-testing/frontend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node environment
        uses: ./.github/actions/setup-node-env

      - name: Build UI
        run: pnpm build

      - name: Save build
        uses: actions/upload-artifact@v7
        with:
          name: ui-build
          path: ab-testing/frontend/output/ab-tests.html
          if-no-files-found: error

  deploy-lambda-ci:
    name: Lambda CI
    runs-on: ubuntu-latest
    needs: [pre-check, ab-testing-checks]
    if: ${{ needs.pre-check.outputs.should-run-ci == 'true' }}
    defaults:
      run:
        working-directory: ab-testing/deploy-lambda
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node environment
        uses: ./.github/actions/setup-node-env

      - name: Build Lambda
        run: pnpm build

      - name: Zip app artifact
        run: |
          cd dist
          zip -r lambda.zip .
          zip -j lambda.zip ../package.json

      - name: Save build
        uses: actions/upload-artifact@v7
        with:
          name: ab-testing-deploy-lambda-build
          path: ab-testing/deploy-lambda/dist/lambda.zip

  notification-lambda-ci:
    name: Notification Lambda CI
    runs-on: ubuntu-latest
    needs: [pre-check, ab-testing-checks]
    if: ${{ needs.pre-check.outputs.should-run-ci == 'true' }}
    defaults:
      run:
        working-directory: ab-testing/notification-lambda
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node environment
        uses: ./.github/actions/setup-node-env

      - name: Build Lambda
        run: pnpm build

      - name: Zip app artifact
        run: |
          cd dist
          zip -r lambda.zip .
          zip -j lambda.zip ../package.json

      - name: Save build
        uses: actions/upload-artifact@v7
        with:
          name: ab-testing-notification-lambda-build
          path: ab-testing/notification-lambda/dist/lambda.zip

  riff-raff:
    name: Riff-Raff Artifacts
    runs-on: ubuntu-latest
    needs: [config-ci, ui-ci, deploy-lambda-ci, notification-lambda-ci]
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ab-testing

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: ./.github/actions/setup-node-env

      - name: Fetch config build
        uses: actions/download-artifact@v8.0.1
        with:
          name: ab-testing-build
          path: ab-testing/config/dist

      - name: Fetch UI build
        uses: actions/download-artifact@v8.0.1
        with:
          name: ui-build
          path: ab-testing/frontend/output/ab-tests.html

      - name: Fetch Deploy Lambda build
        uses: actions/download-artifact@v8.0.1
        with:
          name: ab-testing-deploy-lambda-build
          path: ab-testing/deploy-lambda/dist/lambda.zip

      - name: Fetch Notification Lambda build
        uses: actions/download-artifact@v8.0.1
        with:
          name: ab-testing-notification-lambda-build
          path: ab-testing/notification-lambda/dist/lambda.zip

      - name: CDK Test
        run: pnpm --filter @guardian/ab-testing-cdk test

      - name: CDK synth
        run: pnpm  --filter @guardian/ab-testing-cdk synth

      - name: Riff-Raff Upload
        uses: guardian/actions-riff-raff@v4.3.7
        with:
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          projectName: dotcom:ab-testing
          configPath: ab-testing/cdk/cdk.out/dotcom:ab-testing/riff-raff.yaml
          contentDirectories: |
            ab-testing-config-artifacts:
              - ab-testing/config/dist
            ab-testing-deployment-lambda:
              - ab-testing/deploy-lambda/dist/lambda.zip
            ab-testing-notification-lambda:
              - ab-testing/notification-lambda/dist/lambda.zip
            ab-testing-ui-artifact:
              - ab-testing/frontend/output/ab-tests.html
            cdk.out:
              - ab-testing/cdk/cdk.out
