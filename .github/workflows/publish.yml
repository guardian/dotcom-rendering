on:
  workflow_call:
    inputs:
      production-image-digest:
        description: 'Digest of DCR image in AWS ECR'
        required: true
        type: string
    secrets:
      GU_RIFF_RAFF_ROLE_ARN:
        required: true
      GU_ARTIFACTS_ROLE_ARN:
        required: true

permissions:
  # Allow GitHub to request an OIDC JWT ID token, and to comment on pull requests as required by guardian/actions-riff-raff
  id-token: write
  pull-requests: write
  contents: read
jobs:
  riffraff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node environment
        uses: ./.github/actions/setup-node-env

      # TODO abstract this into a reusable GitHub Action e.g. https://github.com/guardian/actions-publish-image
      - name: AWS ECR configure credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.GU_ARTIFACTS_ROLE_ARN }}
          aws-region: eu-west-1
          mask-aws-account-id: 'true'

      # TODO abstract this into a reusable GitHub Action e.g. https://github.com/guardian/actions-publish-image
      - name: AWS ECR login
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          mask-password: 'true'

      # Clear AWS credentials (stored in environment variables) to avoid leaking them to any subsequent steps
      # See https://github.com/aws-actions/configure-aws-credentials/issues/1308
      # TODO abstract this into a reusable GitHub Action e.g. https://github.com/guardian/actions-publish-image
      - name: AWS ECR clear credentials
        if: always()
        shell: bash
        run: |
          echo "AWS_ACCESS_KEY_ID=''" >>"$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=''" >>"$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=''" >>"$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=''" >>"$GITHUB_ENV"
          echo "AWS_REGION=''" >>"$GITHUB_ENV"

      # TODO abstract this into a reusable GitHub Action e.g. https://github.com/guardian/actions-publish-image
      - name: AWS ECR pull image
        id: ecr-pull
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/guardian/dotcom-rendering@${{ inputs.production-image-digest }}"
          docker pull $IMAGE
          echo "IMAGE=$IMAGE" >> "$GITHUB_OUTPUT"

      # Annoyingly we can't _easily_ access an Images filesystem without creating a container from the image.
      # we don't necessarily have to start the container, but we do need to create it.
      - name: Copy container files into GHA Workspace
        working-directory: dotcom-rendering
        run: |
          CONTAINER_ID=$(docker create ${{ steps.ecr-pull.outputs.IMAGE }})
          docker cp $CONTAINER_ID:/app/. dist

      - name: CDK synth
        env:
          IMAGE_DIGEST: ${{ inputs.production-image-digest }}
        working-directory: dotcom-rendering
        run: make cdk-synth

      - name: Construct EC2 artifacts
        working-directory: dotcom-rendering
        run: make riffraff-bundle

      # We want to avoid uploading the uncompressed files to our riffraff bucket
      # so we create our tarball outside the folder, then delete the contents of
      # the folder, and finally move the tarball into the folder.
      - name: Compress article-rendering app server files
        working-directory: dotcom-rendering/target
        run: |
          tar -zcf article-rendering.tar.gz article-rendering
          rm -r article-rendering/*
          mv article-rendering.tar.gz article-rendering/

      - name: Compress facia-rendering app server files
        working-directory: dotcom-rendering/target
        run: |
          tar -zcf facia-rendering.tar.gz facia-rendering
          rm -r facia-rendering/*
          mv facia-rendering.tar.gz facia-rendering/

      - name: Compress tag-page-rendering app server files
        working-directory: dotcom-rendering/target
        run: |
          tar -zcf tag-page-rendering.tar.gz tag-page-rendering
          rm -r tag-page-rendering/*
          mv tag-page-rendering.tar.gz tag-page-rendering/

      - name: Compress interactive-rendering app server files
        working-directory: dotcom-rendering/target
        run: |
          tar -zcf interactive-rendering.tar.gz interactive-rendering
          rm -r interactive-rendering/*
          mv interactive-rendering.tar.gz interactive-rendering/

      # All rendering apps deployment
      - name: Upload rendering apps to RiffRaff
        uses: guardian/actions-riff-raff@v4.3.6
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          projectName: dotcom:rendering-all
          configPath: dotcom-rendering/target/riff-raff.yaml
          contentDirectories: |
            article-rendering-cfn:
              - dotcom-rendering/target/article-rendering-cfn
            article-rendering:
              - dotcom-rendering/target/article-rendering
            facia-rendering-cfn:
              - dotcom-rendering/target/facia-rendering-cfn
            facia-rendering:
              - dotcom-rendering/target/facia-rendering
            tag-page-rendering-cfn:
              - dotcom-rendering/target/tag-page-rendering-cfn
            tag-page-rendering:
              - dotcom-rendering/target/tag-page-rendering
            interactive-rendering-cfn:
              - dotcom-rendering/target/interactive-rendering-cfn
            interactive-rendering:
              - dotcom-rendering/target/interactive-rendering
            frontend-static:
              - dotcom-rendering/target/frontend-static
